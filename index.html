<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don’t Forget to Write: Vocabulary</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--ink:#1b2236;--mut:#5f6b82;--ac:#3b5bdb;--on:#fff;--ok:#1a7f4b;--no:#c93a31;--ln:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--sf:#1a2231;--ink:#e8ecf4;--mut:#9aa6bb;--ac:#7f9bff;--on:#10151f;--ok:#4cc388;--no:#ef6d63;--ln:#2d384d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--sf:#1a2231;--ink:#e8ecf4;--mut:#9aa6bb;--ac:#7f9bff;--on:#10151f;--ok:#4cc388;--no:#ef6d63;--ln:#2d384d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:960px;margin:0 auto;padding:12px;display:grid;gap:12px}
aside{display:flex;flex-direction:column;gap:10px}
aside .book-head{display:flex;align-items:center;gap:12px}
aside .book-cover{display:block;width:76px;height:auto;flex:0 0 76px;border-radius:4px;box-shadow:0 3px 10px #0002}
aside h1{font-size:1.1rem;margin:0;line-height:1.2;letter-spacing:.04em}aside h1 small{display:block;margin-top:5px;font-size:.78rem;font-weight:400;letter-spacing:.02em;color:var(--mut)}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
@media (min-width:760px){.app{grid-template-columns:210px 1fr;gap:24px;padding:24px}#tabs{flex-direction:column}#tabs button{text-align:left}}
select,button,input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 12px}
button{cursor:pointer;min-height:42px}button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#tabs button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--mut)}.chk input{margin-top:3px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.st{display:flex;gap:16px;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.trk{position:relative;margin:2px 0 12px;padding-top:30px}
.bar{height:12px;border-radius:6px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .7s ease}
.pet{position:absolute;top:0;font-size:26px;line-height:30px;transition:left .7s ease, transform .7s ease;transform: translateX(-50%) scaleX(-1);animation:jump 0.6s ease-in-out infinite}
@keyframes jump{
  0%, 100% { transform: translateX(-50%) scaleX(-1) translateY(0px) scale(1, 0.9); }
  50% { transform: translateX(-50%) scaleX(-1) translateY(-10px) scale(0.9, 1.1); }
}
@media (prefers-reduced-motion:reduce){.pet{animation:none}.bar i,.pet{transition:none}}
.card{perspective:1200px;height:440px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;overflow:auto}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front b{font-size:1.9rem;line-height:1.25}
.phonetic{font-size:1.1rem;color:var(--mut);margin:6px 0 12px;font-family:"Noto Sans","DejaVu Sans","Segoe UI",Roboto,Arial,system-ui,sans-serif;font-style:italic;font-weight:500;letter-spacing:.02em}
.btn-listen,.btn-uk{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;min-height:36px;font-size:.88rem;border-radius:20px;margin-top:8px}
.uk-box{margin-top:10px;padding:10px;background:color-mix(in srgb,var(--ac) 8%,var(--sf));border:1px solid var(--ln);border-radius:8px;font-size:.9rem;text-align:left;color:var(--ink)}
.hint{color:var(--mut);font-size:.85rem;margin-top:14px}
.stars{text-align:center;margin:0 0 4px}.stars svg{width:15px;height:15px;margin:0 1px;vertical-align:middle}
.stars .on{fill:var(--ac);stroke:var(--ac)}.stars .off{fill:none;stroke:var(--mut);opacity:.55}.stars svg{stroke-width:1.6;stroke-linejoin:round}
.fcap{font-size:.6rem;color:var(--mut);letter-spacing:.03em;margin-top:2px}
.hw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}.hw b{font-size:1.15rem;line-height:1.25}.hw .phonetic{margin:0 0 0 6px;font-size:.9rem}
.btn-mini{min-height:34px;padding:4px 10px;border-radius:20px;font-size:.85rem;flex:none}
.var{margin-top:6px;font-size:.85rem;color:var(--mut)}.var b{color:var(--ink);font-weight:600}
.chips{margin:0 0 4px}.fchips{margin:0 0 6px;text-align:center}.chip{display:inline-block;font-size:.72rem;padding:1px 9px;border:1px solid var(--ln);border-radius:10px;color:var(--mut);margin:0 4px 4px 0;background:color-mix(in srgb,var(--ac) 6%,var(--sf))}
.back{transform:rotateY(180deg);padding:16px 20px;font-size:.95rem;line-height:1.4}.back h3{margin:9px 0 1px;font-size:.8rem;color:var(--ac)}.back h3:first-child{margin-top:0}
.back p{margin:0}.back ul{margin:0;padding-left:20px}.back blockquote{margin:0 0 6px;padding:4px 10px;border-left:3px solid var(--ac);font-style:italic}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts button{min-height:50px;font-weight:600}.no{color:var(--no);border-color:var(--no)}.ok{color:var(--ok);border-color:var(--ok)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0}.sc{color:var(--mut);font-size:.9rem}
.box,.q{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px}
.box h2{margin:0 0 6px;font-size:1.2rem}
.def{font-weight:600;font-size:1.1rem;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.seg button{min-height:34px;padding:4px 12px;border-radius:20px;font-size:.85rem}.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sf))}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--sf))}
.msg{font-weight:600}.msg.good{color:var(--ok)}.msg.bad{color:var(--no)}
input[type=text],input[type=search]{width:100%;margin:6px 0}
details.it summary>span{font-weight:400}details.it .phonetic{font-weight:500;font-style:italic;margin:0 0 0 8px;font-size:.95rem}
details.it{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin:6px 0;padding:10px 14px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:600}
summary em{font-style:normal;font-weight:400;font-size:.8rem;color:var(--mut)}summary em.kn{color:var(--ok)}
details p{margin:6px 0 0;font-size:.95rem}
</style></head>

{f:3,r:"idiom",w:"lose your mind",t:"/luːz jʊr maɪnd/",d:"(informal) to become extremely angry or upset, or to behave as if you are crazy.",uk:"втратити самовладання, розлютитися або дуже засмутитися",c:"Her father would be furious if she studied in a school with both boys and girls.",e:"My boss will lose his mind if we miss this deadline.|My mom will lose her mind if I come home late.|He lost his mind when he saw the broken window."},
{f:2,r:"idiom",w:"not look twice at someone",t:"/nɑːt lʊk twaɪs æt ˈsʌmwʌn/",d:"to not notice someone or not find them interesting.",uk:"не звертати жодної уваги, навіть не дивитися в чийсь бік",c:"When they were younger, she never paid attention to Daniel.",e:"Years ago, nobody looked twice at him. Now he is a famous actor.|I never looked twice at that old car.|Nobody looked twice at the quiet new student."},
{f:1,r:"idiom",w:"be fair game",t:"/bi fɛr ɡeɪm/",d:"a person or thing that you are allowed to criticize, tease or chase.",uk:"бути дозволеною мішенню для критики, глузувань або переслідування",c:"She decides that Daniel is fair game: she can flirt with him if he looks her way.",e:"When you are a politician, your private life is fair game for journalists.|Famous people are fair game for the newspapers.|The mayor is fair game for the reporters’ questions."},
{v:"skate on thin ice",f:2,r:"idiom",w:"be on thin ice",t:"/bi ɑːn θɪn aɪs/",d:"to be in a risky situation where you could easily get into trouble.",uk:"ходити по тонкому льоду (ризикувати, наражатися на небезпеку)",c:"Her parents are already unhappy with her, so she must be careful.",e:"You are already on thin ice with your teacher, so don’t be late again.|You are on thin ice with me after that lie.|He is on thin ice at work because he is often late."},
{f:3,w:"do as you please",t:"/duː æz juː pliːz/",d:"to do exactly what you want, with no one telling you what to do.",uk:"робити все, що заманеться / діяти на власний розсуд",c:"She went to college because her father would be far away and she could do what she liked.",e:"Now the kids have left home, we can do as we please.|It is my day off, so I can do as I please.|On holiday, we do as we please."},
{f:2,r:"idiom",w:"know what is good for you",t:"/noʊ wʌt ɪz ɡʊd fɔːr juː/",d:"to be sensible enough to do the thing that keeps you out of trouble.",uk:"знати, що для тебе краще (щоб не вскочити в халепу)",c:"She thinks Daniel will come quickly, because a smart boy would not make her wait.",e:"If she knows what’s good for her, she will say sorry to the manager.|Say sorry now, if you know what’s good for you.|He knows what’s good for him, so he does his homework."},
{f:2,r:"phrasal verb",w:"play out",t:"/pleɪ aʊt/",d:"to happen or develop in a certain way, like a story.",uk:"розгортатися, розігруватися (про події чи ситуацію)",c:"She watches Daniel’s face as he decides between being good and being bad.",e:"We watched the argument play out between our two neighbors.|We watched the football game play out.|Let’s see how the story plays out."},
{f:1,w:"get an eyeful (of something)",t:"/ɡɛt ən ˈaɪfʊl əv ˈsʌmθɪŋ/",d:"(informal) to see a lot of something, often something surprising or private.",uk:"побачити щось несподіване, відверте або пікантне; побачити більше, ніж очікував",c:"She sits so that Daniel can see part of her leg and her garter.",e:"When the door opened, everyone got an eyeful of the surprise party.|The neighbors got an eyeful when the curtains were left open.|We got an eyeful of the celebrity’s private argument."},
{f:2,r:"phrasal verb",w:"make out",t:"/meɪk aʊt/",d:"(informal) to kiss someone for a long time, usually with touching.",uk:"пристрасно цілуватися",c:"She jokes that it would be embarrassing to be hurt while kissing in the rabbi’s office.",e:"A couple of teenagers were making out at the back of the cinema.|The two teenagers were making out in the park.|The couple in the movie made out in the car."},
{f:1,r:"idiom",w:"there are worse ways to go",t:"/ðɛr ɑːr wɜːrs weɪz tuː ɡoʊ/",d:"a joking, understated way to say that a particular way of dying or ending is not the worst possible one.",uk:"бувають і гірші способи померти (жартівливий евфемізм)",c:"Looking at her angry father, she decides that dying from broken glass might be better than facing him.",e:"Dying in your sleep at 100 years old? There are worse ways to go.|He passed away eating his favorite cake. There are worse ways to go.|Falling asleep in a warm bed? There are worse ways to go."},
{f:1,w:"jiggle your leg",t:"/ˈdʒɪɡl jʊr lɛɡ/",d:"to move your leg up and down with small, quick movements, often because you are nervous or bored.",uk:"смикати ногою (від нетерплячки чи хвилювання)",c:"She shakes her leg during the sermon, and her father tells her to stop.",e:"He jiggles his leg under the table when he is nervous.|She jiggles her leg when the lesson is boring.|Stop jiggling your leg! The table is shaking."},
{f:2,r:"phrasal verb",w:"drone on (about something)",t:"/droʊn ɑːn/",d:"to talk for a long time in a flat, boring voice.",uk:"монотонно й нудно бубніти / розказувати нудьгу",c:"This describes the rabbi’s long, dull sermon.",e:"The lecturer droned on about taxes for an hour.|The speaker droned on and on.|My uncle droned on about his old job at dinner."},
{f:2,w:"flash a smile",t:"/flæʃ ə smaɪl/",d:"to give someone a quick, brief smile.",uk:"швидко всміхнутися, кинути комусь усмішку",c:"She gives Daniel a quick, flirty smile.",e:"She flashed a smile at the waiter and ordered another coffee.|He flashed a smile and said hello.|The singer flashed a smile at the crowd."},
{f:1,w:"hands rove",t:"/hændz roʊv/",d:"to move around over a surface or body without staying in one place.",uk:"руки, що ковзають / блукають по чомусь або чиємусь тілу",c:"Daniel’s hands move over her sides and into her hair while they kiss.",e:"His hands roved over her shoulders and down her back.|Her hands roved over the piano keys.|His hands roved across the soft fabric of the coat."},
{f:2,w:"be crammed (into / between)",t:"/bi kræmd/",d:"to be packed tightly into a small space, or filled with too many people or things.",uk:"бути набитим чимось / кимось; тіснитися в обмеженому просторі",c:"The rabbi’s office is so messy that papers are stuffed between the pages of books.",e:"My suitcase was crammed with souvenirs.|The train was crammed with people.|I crammed all my books into one bag."},
{f:2,w:"nonnegotiable",t:"/ˌnɑːnnɪˈɡoʊʃiəbl/",d:"impossible to change or discuss.",uk:"те, що не підлягає обговоренню чи перегляду",c:"Going to the synagogue on Saturday morning is a rule for her, whatever she did the night before.",e:"For my parents, Sunday dinner with the family is nonnegotiable.|The deadline is nonnegotiable.|Safety rules are nonnegotiable on this trip."},
{f:2,w:"dreamy",t:"/ˈdriːmi/",d:"(informal) very attractive in a way that makes you imagine romantic things.",uk:"дуже привабливий, красень / красуня (розмовне)",c:"The narrator finds a young politician good-looking.",e:"All the girls in my class thought the new teacher was dreamy.|I think that singer is dreamy.|She said her new boyfriend looked dreamy."},
{f:1,w:"demure",t:"/dɪˈmjʊr/",d:"quiet, polite and a little shy, especially in an old-fashioned way.",uk:"скромний, стриманий, сором’язливий",c:"She leaves the room looking very polite and innocent, but she has a secret plan.",e:"She gave a demure smile and lowered her eyes.|Her demure manner made her seem shy and reserved.|She wore a simple dress and spoke in a demure voice."},
{f:2,w:"stern",t:"/stɜːrn/",d:"serious and strict, showing that you do not approve.",uk:"суворий, похмурий, непохитний",c:"She pictures the rabbi as a strict man, but his office is a mess.",e:"The headmaster gave us a stern warning.|My grandfather has a stern face.|The teacher spoke in a stern voice."},
{f:2,w:"tingle",t:"/ˈtɪŋɡl/",d:"a light, prickly feeling on your skin, often from excitement.",uk:"поколювання, мурашки (від холоду чи сильних емоцій)",c:"Daniel touches her hand, and she feels a quick, exciting feeling go along her back.",e:"I felt a tingle of excitement before going on stage.|I felt a tingle in my fingers from the cold.|A tingle of fear ran down my back."},
{f:2,w:"tumble",t:"/ˈtʌmbl/",d:"to fall suddenly and without control.",uk:"перекинутися, кубарем котитися, впасти",c:"She and Daniel fall backward through the glass and out into the room.",e:"The little boy tumbled down the stairs, but he wasn’t hurt.|The ball tumbled down the hill.|He tumbled off his bike but stood up."},
{f:1,w:"shard",t:"/ʃɑːrd/",d:"a small, sharp piece of broken glass or pottery.",uk:"уламок (скла, кераміки)",c:"Pieces of colored glass lie all around them after the window breaks.",e:"She cut her foot on a shard of glass.|A shard of the broken cup was on the floor.|Be careful! There is a shard of glass here."},
{f:2,w:"smeared",t:"/smɪrd/",d:"covered with a thick, sticky or messy substance.",uk:"вимазаний, заляпаний, розмазаний",c:"Daniel’s face is covered with her red lipstick.",e:"The child’s face was smeared with chocolate.|His shirt was smeared with paint.|My hands were smeared with mud."},
{f:1,w:"precariously",t:"/prɪˈkɛriəsli/",d:"in a way that is not safe and could fall or fail at any moment.",uk:"ненадійно, непевно, хистко",c:"The holy scroll shakes dangerously in the arms of the man who is carrying it.",e:"The pile of books was balanced precariously on the edge of the table.|The cup sat precariously on the edge of the shelf.|He climbed precariously up the old ladder."},
{f:2,w:"eerily",t:"/ˈɪrəli/",d:"in a strange and slightly frightening way.",uk:"моторошно, химерно до жаху",c:"Everyone in the room has the same shocked look on their faces, which feels strange.",e:"The house was eerily quiet when we came in.|The empty street was eerily silent.|An eerily white mist covered the lake."}
],

"Chapter 2": [
{f:2,r:"phrasal verb",w:"pick at (something)",t:"/pɪk æt/",d:"to pull small pieces off something again and again with your fingers, often because you are bored or upset.",uk:"скубти, общипувати пальцями",c:"She is angry, so she keeps pulling at the cover on her bed.",e:"She picked at her sweater while she waited.|Don’t pick at your food. Please eat it.|He picked at the label on the bottle."},
{f:3,w:"come to think of it",t:"/kʌm tuː θɪŋk əv ɪt/",d:"used when you suddenly remember or realize something.",uk:"до речі, якщо згадати / коли замислитися",c:"She looks around her room and suddenly realizes it is time to change the pink decorations.",e:"Come to think of it, I haven’t seen Tom this week.|Come to think of it, I left my keys at work.|Come to think of it, that is a good idea."},
{f:3,w:"rant",t:"/rænt/",d:"to talk loudly and angrily for a long time.",uk:"довго й гнівно висловлюватися, влаштовувати гнівну тираду",c:"Her father is shouting angrily downstairs about what she did.",e:"He ranted about the bad service for ten minutes.|My boss was ranting about the late report.|Stop ranting and listen to me."},
{f:2,w:"gaze out (of / at)",t:"/ɡeɪz aʊt/",d:"to look at something for a long time, often while thinking about other things.",uk:"вдивлятися, зачаровано дивитися у вікно / на щось",c:"She sits at the window and looks at the street for a long time.",e:"He gazed out of the train window.|The children gazed at the snow.|I gazed out at the sea and relaxed."},
{f:3,w:"overrated",t:"/ˌoʊvərˈreɪtɪd/",d:"thought to be better or more important than it really is.",uk:"переоцінений",c:"She decides that being a princess is not as wonderful as people think.",e:"I think that new restaurant is overrated.|Many people say money is overrated.|The film was overrated, and I was bored."},
{f:3,r:"idiom",w:"easier said than done",t:"/ˈiːziər sɛd ðæn dʌn/",d:"used when something sounds simple but is really difficult to do.",uk:"легше сказати, ніж зробити",c:"She wants to take care of herself, but that is hard for a young woman in 1960.",e:"“Just stop worrying.” Easier said than done!|Learning a language in a month is easier said than done.|Saving money is easier said than done."},
{f:2,w:"telltale (sign / sound)",t:"/ˈtɛlteɪl saɪn/",d:"showing clearly that something exists or is happening, even if no one says it.",uk:"виразний знак, промовистий доказ",c:"She hears the sounds of lunch being made, which show that her father has stopped shouting.",e:"A red nose is a telltale sign of a cold.|I heard the telltale click of the door.|The smell of smoke was a telltale sign of a fire."},
{f:2,w:"summon",t:"/ˈsʌmən/",d:"to officially order someone to come to you.",uk:"викликати (офіційно до себе)",c:"She wonders if her parents will call her down for lunch or leave her upstairs.",e:"The teacher summoned me to her office.|The king summoned his servant.|I was summoned to a meeting with the manager."},
{f:3,w:"to be fair",t:"/tuː biː fɛr/",d:"used before you add a point that makes your opinion fairer or more balanced.",uk:"якщо бути справедливим / якщо поглянути об’єктивно",c:"She admits that this time she did something worse than usual.",e:"To be fair, he did try his best.|The test was hard. To be fair, we didn’t study.|To be fair, it was not her fault."},
{f:1,w:"misdeed",t:"/mɪsˈdiːd/",d:"a bad or wrong action.",uk:"лихий вчинок, провина",c:"She falls asleep easily and does not feel guilty about what she did.",e:"The boy was punished for his misdeeds.|The thief paid for his misdeeds.|She was sorry for her misdeed."},
{f:1,w:"unbothered",t:"/ʌnˈbɑːðərd/",d:"not worried or upset about something.",uk:"байдужий, нестривожений, спокійний",c:"She goes to sleep calmly and does not feel sorry for her actions.",e:"He was unbothered by the noise.|She looked unbothered by the bad news.|I am unbothered by what people say."},
{f:1,w:"a twinge of conscience",t:"/ə twɪndʒ əv ˈkɑːnʃəns/",d:"a small, quick feeling of guilt.",uk:"укол сумління, докір сумління",c:"She should feel a little guilty after doing something wrong, but she does not.",e:"He felt a twinge of conscience after telling the lie.|I had a twinge of conscience when I ate the last cake.|She felt no twinge of conscience about it."},
{f:2,w:"muffled",t:"/ˈmʌfld/",d:"quiet and difficult to hear clearly, because something is covering the sound.",uk:"приглушений (про звук)",c:"When she wakes up, she hears quiet voices from downstairs.",e:"I heard muffled music through the wall.|His voice was muffled by the scarf.|We heard a muffled cry from the room."},
{f:1,w:"bellow",t:"/ˈbɛloʊ/",d:"to shout in a very loud, deep voice.",uk:"ревіти, голосно кричати басом",c:"Her father shouts her name loudly from downstairs.",e:"The coach bellowed at the players.|He bellowed my name across the street.|The angry man bellowed, “Get out!”"},
{f:2,w:"open the door a crack",t:"/ˈoʊpən ðə dɔːr ə kræk/",d:"to open a door only a very small amount.",uk:"прочинити двері (на щілину)",c:"She opens her bedroom door just a little before answering her father.",e:"She opened the window a crack for fresh air.|He opened the door a crack and looked outside.|Please leave the door open a crack."},
{f:2,w:"tame",t:"/teɪm/",d:"to make someone or something calmer and easier to control.",uk:"опанувати, приборкати",c:"She puts on lipstick because she thinks it will help her deal with her angry father and the guests.",e:"He tamed the wild horse.|She tried to tame her curly hair.|It is hard to tame an angry crowd."},
{f:2,w:"skid to a stop",t:"/skɪd tuː ə stɑːp/",d:"to slide along the ground for a short distance before you stop.",uk:"зупинитися юзом / ковзанням",c:"She runs down the stairs and skids to a stop on the polished floor by the living room door.",e:"The car skidded to a stop on the wet road.|The boy skidded to a stop in front of the door.|The bike skidded to a stop."},
{f:3,w:"weigh your options",t:"/weɪ jʊr ˈɑːpʃnz/",d:"to think carefully about the good and bad sides of each choice before deciding.",uk:"зважити всі за і проти, обміркувати варіанти",c:"She thinks about her choices, such as running away or joining the circus.",e:"Take your time and weigh your options.|We weighed our options before buying the car.|She weighed her options and took the job."},
{f:3,w:"not my style",t:"/nɑːt maɪ staɪl/",d:"not the kind of thing that you like or usually do.",uk:"не в моєму стилі, не моє",c:"She jokes that she would not like to live in a tent as a nomad.",e:"Big parties are not my style.|That dress is nice, but it’s not my style.|Camping is not really my style."},
{f:2,r:"idiom",w:"(cannot do something) to save your life",t:"/tuː seɪv jʊr laɪf/",d:"used to say that you are very bad at something.",uk:"геть не вміти чогось (хоч вбий)",c:"She jokes that she cannot walk on a rope or grow a beard, so she would be a bad circus worker.",e:"I can’t sing to save my life.|He can’t cook to save his life.|She can’t draw to save her life."},
{f:3,r:"idiom",w:"it takes two to tango",t:"/ɪt teɪks tuː tuː ˈtæŋɡoʊ/",d:"used to say that when something goes wrong, both people are responsible.",uk:"тут винні обидвоє, танцюють удвох",c:"She says Daniel is not the only one to blame for the kiss, because she took part too.",e:"It takes two to tango, so don’t blame only him.|They argued, but it takes two to tango.|Don’t blame her alone. It takes two to tango."},
{f:2,r:"idiom",w:"go for broke",t:"/ɡoʊ fɔːr broʊk/",d:"to take a big risk and try for the greatest success.",uk:"піти ва-банк, ризикнути заради великого успіху",c:"She decides to take a big risk and tell the rabbi exactly what she thinks of his sermon.",e:"In the final game, they decided to go for broke.|I will go for broke and ask for a new job.|She went for broke and entered the contest."},
{f:3,r:"idiom",w:"(as boring as) watching paint dry",t:"/ˈwʌtʃɪŋ peɪnt draɪ/",d:"used to say that something is extremely boring.",uk:"нудно до нестями (як дивитися, як сохне фарба)",c:"She imagines saying that the rabbi’s sermon was as dull as waiting for paint to dry.",e:"The meeting was as boring as watching paint dry.|Waiting for the bus was like watching paint dry.|This film is as exciting as watching paint dry."},
{f:2,r:"idiom",w:"save face",t:"/seɪv feɪs/",d:"to do something so that people do not think badly of you or feel ashamed.",uk:"зберегти обличчя (уникнути сорому)",c:"She says the parents want to marry the two young people only to avoid shame.",e:"He lied to save face.|She said sorry to save face.|They changed the plan to save face."},
{f:1,w:"thunder (verb)",t:"/ˈθʌndər/",d:"to say something in a very loud and angry voice.",uk:"гриміти, грізно вигукувати",c:"Her father shouts in a loud, angry voice that she must marry Daniel.",e:"“Get out!” the teacher thundered.|The general thundered at his soldiers.|“Come here now!” thundered my dad."},
{f:2,w:"mean well",t:"/miːn wɛl/",d:"to have good intentions, even if the result is not good.",uk:"мати добрі наміри",c:"She tells Daniel that she thinks he is kind but that his idea is wrong.",e:"My aunt means well, but she gives bad advice.|He meant well when he cooked dinner.|I know you mean well, but please stop."}
],

"Chapter 3": [
{f:2,w:"pace (a room)",t:"/peɪs/",d:"to walk up and down in a small area again and again, usually because you are nervous, worried or thinking hard.",uk:"намотувати кола по кімнаті, ходити туди-сюди",c:"After her father sends her upstairs, she walks up and down her bedroom for a whole hour, worrying about what will happen next.",e:"He paced the hall while he waited for the doctor.|I was pacing the room before my job interview.|She paced up and down outside the exam room."},
{f:2,w:"in a huff",t:"/ɪn ə hʌf/",d:"(informal) in an offended or annoyed mood, often because you feel insulted; you may leave suddenly.",uk:"ображено й роздратовано, демонструючи невдоволення",c:"The Schwartz family leave the house angry and offended after the terrible argument.",e:"He left the meeting in a huff when nobody agreed with him.|She walked out of the shop in a huff.|My brother went to his room in a huff after we laughed at him."},
{f:2,w:"show your face",t:"/ʃoʊ jʊr feɪs/",d:"to appear in a place where people may be angry with you or may not want to see you. It is often used in the negative: “I can’t show my face there.”",uk:"з'являтися на людях (після сорому)",c:"Her mother is sure the family can never go back to the synagogue, because they are so embarrassed.",e:"After lying to everyone, he couldn’t show his face at work.|I was so embarrassed that I didn’t dare show my face at the party.|How can she show her face here after what she said?"},
{f:2,w:"go over well / poorly",t:"/ɡoʊ ˈoʊvər wɛl ɔːr ˈpʊrli/",d:"to be received by people in a good or bad way.",uk:"бути сприйнятим добре / погано",c:"She jokes that her idea of buying a new, stronger holy cupboard for the synagogue was received as badly as Daniel’s marriage proposal.",e:"My joke went over poorly at dinner.|The new rules went over well with the students.|His speech went over well with the audience."},
{f:2,w:"disown",t:"/dɪsˈoʊn/",d:"to say that you no longer want to be part of someone’s family, or to refuse to have any connection with a person.",uk:"відректися від когось",c:"She knows her parents cannot force her to marry Daniel, but they could stop treating her as their daughter.",e:"His father threatened to disown him if he left the family business.|She was disowned by her family when she married him.|Some parents disown children who break the family rules."},
{f:1,uk:"таємно втекти, щоб одружитися (без згоди батьків)",w:"elope",t:"/ɪˈloʊp/",d:"to run away secretly to get married, often without telling your parents.",c:"She remembers a girl in their community who ran away to marry a boy from another religion, and her family treated her as if she had died.",e:"They eloped because their parents did not approve.|My grandparents eloped in 1955.|The couple eloped to Las Vegas and told everyone later."},
{f:2,w:"too steep (a price / punishment)",t:"/tuː stiːp/",d:"(informal) too high or expensive (of a price); too severe (of a penalty).",uk:"надто дорого (про ціну); надто суворо (про покарання)",c:"Even her father thinks that treating a runaway daughter as dead is too extreme a punishment.",e:"Paying $200 for a sandwich is too steep a price.|The price of the ticket was too steep for us.|A year in prison would be too severe a punishment for such a minor offence."},
{f:2,w:"granted",t:"/ˈɡræntɪd/",d:"used to admit that something is true before you give a different opinion. It means “it is true that”.",uk:"правда, якщо визнати, що... / звісно",c:"The narrator admits that her father said the punishment was too severe, but then he warned her not to get any ideas.",e:"Granted, the hotel is old, but the staff are very kind.|Granted, he is young, but he works hard.|Granted, it’s expensive. But it’s also very good."},
{f:1,w:"rush to the altar",t:"/rʌʃ tuː ði ˈɔːltər/",d:"to get married in a hurry, without waiting or thinking carefully.",uk:"квапливо бігти до вівтаря / одружуватися поспіхом",c:"She says there was no reason to hurry into marriage, because she wants to live her life first.",e:"They didn’t rush to the altar; they dated for six years.|Don’t rush to the altar just because your friends are married.|He was afraid to rush to the altar after only two months."},
{f:2,w:"rebellious streak",t:"/rɪˈbɛliəs striːk/",d:"a part of someone’s character that makes them want to break rules or disobey.",uk:"бунтівна жилка, схильність до бунту",c:"Her father has little patience with her habit of breaking the rules, but her mother usually calms him down.",e:"My sister has a rebellious streak and never follows the rules.|He had a rebellious streak as a teenager.|Her purple hair shows her rebellious streak."},
{f:2,w:"steel yourself",t:"/stiːl jʊrˈsɛlf/",d:"to prepare yourself mentally to deal with something unpleasant.",uk:"підготуватися морально, зібратися з духом",c:"She gets ready for her father’s angry lecture as she follows her mother downstairs.",e:"He steeled himself before opening the exam results.|I steeled myself to tell her the bad news.|She steeled herself for the long, cold walk."},
{f:3,w:"go too far",t:"/ɡoʊ tuː fɑːr/",d:"to do more than is acceptable; to behave in a way that is too extreme.",uk:"перейти межу, зайти надто далеко",c:"Her father says that her behavior is worse than ever this time and that he must act.",e:"Joking is fine, but you went too far this time.|She went too far when she shouted at the teacher.|I think the newspaper went too far with that story."},
{f:2,w:"issue an ultimatum",t:"/ˈɪʃuː ən ˈʌltɪmeɪtəm/",d:"(formal) to give someone a final demand and say that something bad will happen if they refuse.",uk:"висунути ультиматум",c:"Her father gives her a final choice: marry the rabbi’s son or be sent away from home.",e:"The boss issued an ultimatum: finish the project or lose your job.|My parents issued an ultimatum: study or no phone.|The company issued an ultimatum to its workers."},
{f:2,r:"idiom",w:"can do no wrong",t:"/kæn doʊ noʊ rɔːŋ/",d:"used about a person whom others always praise or forgive, whatever they do.",uk:"у чиїхось очах не може зробити нічого поганого",c:"Her older brother is the favorite child in the family, and he always pleases their parents.",e:"To his grandmother, little Tom can do no wrong.|The teacher’s favorite student can do no wrong.|My dog can do no wrong in my eyes."},
{f:3,r:"idiom",w:"follow in someone’s footsteps",t:"/ˈfɑːloʊ ɪn ˈsʌmwʌnz ˈfʊtstɛps/",d:"to do the same job or live the same way as someone before you, often a family member.",uk:"іти чиїмось стопами",c:"Her brother became a doctor like their father, which makes her parents very proud.",e:"She followed in her mother’s footsteps and became a nurse.|He wants to follow in his father’s footsteps.|Many children follow in their parents’ footsteps."},
{f:3,r:"idiom",w:"(do something) in your sleep",t:"/ɪn jʊr sliːp/",d:"to be able to do something very easily because you have done it so many times.",uk:"робити із заплющеними очима / дуже легко",c:"She is sure she can escape the attention of an old woman who watches her, because it is so easy for her.",e:"I know this road so well that I could drive it in my sleep.|He can solve these math problems in his sleep.|She could bake that cake in her sleep."},
{f:1,w:"banish",t:"/ˈbænɪʃ/",d:"to send someone away from a place as a punishment.",uk:"вислати, заслати, вигнати",c:"She is shocked at being sent to New Jersey, and she dramatically says her parents are sending her into exile.",e:"The king banished the thief from the country.|My brother was banished to his room.|He felt banished to the back of the office."},
{f:2,r:"phrasal verb",w:"take someone in",t:"/teɪk ˈsʌmwʌn ɪn/",d:"to let someone live in your home, especially when they need help.",uk:"прихистити, взяти до себе",c:"Her great-aunt has agreed to let her stay in her home for the summer.",e:"When the storm came, our neighbors took us in.|My aunt took in a stray cat.|They took in a student from Spain."},
{f:3,r:"idiom",w:"have your hands full",t:"/hæv jʊr hændz fʊl/",d:"to be very busy with a difficult task or with too many things to take care of.",uk:"бути завантаженим роботою / мати повно клопотів",c:"Her father jokes that her great-aunt will be very busy trying to find a husband for such a difficult girl.",e:"With three small children, she has her hands full.|The new manager has his hands full this week.|I have my hands full with this project."},
{f:2,uk:"бути готовим прийняти виклик, «я на це здатен»",w:"be up for the challenge",t:"/bi ʌp fɔːr ðə ˈtʃælɪndʒ/",d:"to be ready and happy to try something difficult.",c:"The matchmaker is glad to take on the job of finding a husband for her.",e:"Learning Chinese is hard, but I’m up for the challenge.|Are you up for the challenge of running a marathon?|She was up for the challenge and took the new job."},
{f:2,r:"idiom",w:"cross my heart",t:"/krɔːs maɪ hɑːrt/",d:"used to promise that you are telling the truth or that you will do something.",uk:"чесне слово! / клянуся!",c:"She promises her mother that she will never behave like that again, and she makes the sign over her chest.",e:"I didn’t eat your cake, cross my heart!|Cross my heart, I will call you tomorrow.|“Do you promise?” “Cross my heart.”"},
{f:2,w:"be on your best behavior",t:"/bi ɑːn jʊr bɛst bɪˈheɪvjər/",d:"to behave as politely and well as possible.",uk:"поводитися якомога краще",c:"Her mother says she must behave very well in her great-aunt’s house if she wants to go back to college.",e:"The children were on their best behavior at the wedding.|Be on your best behavior when you meet my parents.|He was on his best behavior at the interview."},
{f:2,r:"idiom",w:"kiss something goodbye",t:"/kɪs ˈsʌmθɪŋ ɡʊdˈbaɪ/",d:"(informal) to accept that you will lose something or will not get it.",uk:"проститися з чимось / забути про щось (як про втрачене)",c:"Her mother warns that if she is sent home for bad behavior, she can forget about college.",e:"If you don’t study, you can kiss your good grades goodbye.|Take an umbrella, or kiss your new suit goodbye.|He kissed his holiday goodbye when he broke his leg."},
{f:1,r:"phrasal verb",w:"marry (someone) off",t:"/ˈmæri ˈsʌmwʌn ɔːf/",d:"to find a husband or wife for someone, especially a young person, so that the family is satisfied.",uk:"видати заміж / одружити",c:"She imagines that the matchmaker will find her a boring husband with a bald spot and a lisp.",e:"Her parents wanted to marry her off before she was twenty-five.|In the old days, families married off their daughters young.|He joked that his mother wants to marry him off."},
{f:2,w:"matchmaker",t:"/ˈmætʃˌmeɪkər/",d:"a person whose job is to introduce people who might get married.",uk:"сват, сваха",c:"Her great-aunt Ada is the best matchmaker in Philadelphia, and she will try to find the narrator a husband.",e:"The matchmaker introduced my cousin to her husband.|My grandmother is a good matchmaker among her friends.|In some cultures, a matchmaker helps families find a partner for their children."},
{f:2,w:"grumble",t:"/ˈɡrʌmbl/",d:"to complain in a quiet, unhappy voice.",uk:"бурчати, невдоволено буркотіти",c:"She says quietly that if her mother liked the shore so much, she would have gone back there.",e:"He grumbled about the early start.|The workers grumbled about their pay.|“It’s too cold,” she grumbled."},
{f:2,w:"grudgingly",t:"/ˈɡrʌdʒɪŋli/",d:"in a way that shows you do not really want to do something.",uk:"неохоче, скриплячи зубами",c:"She takes clothes out of her drawer without any joy, because she has to go to her great-aunt’s house.",e:"He grudgingly agreed to help us.|She grudgingly said sorry.|The teacher grudgingly gave us more time."},
{f:2,r:"phrasal verb",w:"straighten out",t:"/ˈstreɪtən aʊt/",d:"(informal) to stop behaving badly and start behaving well. It can also mean to solve a confusing problem.",uk:"виправитися, взятися за розум",c:"Her mother says the summer with her strict great-aunt will teach her to behave properly.",e:"The army helped to straighten him out.|It’s time you straightened out and found a job.|Let’s straighten out this misunderstanding."}
],

"Chapter 4": [
{f:2,w:"outnumber",t:"/ˌaʊtˈnʌmbər/",d:"to be more in number than something else.",uk:"перевершувати за чисельністю",c:"In Philadelphia there were more trolleys than cars, which surprised her after New York.",e:"Girls outnumber boys in my English class.|In this town, bicycles outnumber cars.|The visitors outnumbered the locals at the festival."},
{f:2,w:"crane your neck",t:"/kreɪn jʊr nɛk/",d:"to stretch your neck forward or upward to see something better.",uk:"витягнути шию (щоб краще роздивитися)",c:"Unlike in New York, she did not have to look up high to see the tops of the buildings in Philadelphia.",e:"We craned our necks to see the singer on stage.|He craned his neck to look over the crowd.|Tourists crane their necks to see the tall tower."},
{f:1,w:"wrangle",t:"/ˈræŋɡl/",d:"(informal) to move or control something that is difficult to manage, with a lot of effort.",uk:"впоратися з чимось важким, перетягти/втиснути з зусиллям",c:"She hopes she will not have to push and pull her huge trunk onto a small trolley car.",e:"I wrangled my heavy suitcase onto the bus.|She wrangled the children into the car.|He wrangled the big dog into the bath."},
{f:2,w:"eye someone suspiciously",t:"/aɪ ˈsʌmwʌn səˈspɪʃəsli/",d:"to look at someone carefully because you do not trust them.",uk:"підозріло позирати на когось / дивитися з недовірою",c:"A stranger knows her name, so she looks at him with distrust, like a typical New Yorker.",e:"The shop assistant eyed the man suspiciously.|The cat eyed the strange dog suspiciously.|She eyed the unknown package suspiciously."},
{f:1,r:"idiom",w:"not know someone from Adam",t:"/nɑːt noʊ ˈsʌmwʌn frʌm ˈædəm/",d:"(informal) to not know a person at all.",uk:"абсолютно нікого не знати (бути незнайомцем)",c:"She tells Thomas she does not know him at all, so she cannot just trust him.",e:"Why should I lend you money? I don’t know you from Adam.|He asked me to look after his dog, but I don’t know him from Adam.|A man called to say he was my cousin, but I don’t know him from Adam."},
{f:3,r:"idiom",w:"serve someone right",t:"/sɜːrv ˈsʌmwʌn raɪt/",d:"used when someone deserves something bad that has happened to them.",uk:"так йому й треба; по заслугах",c:"She admits that she made a foolish assumption about Thomas and accepts that she deserves the embarrassment.",e:"He didn’t study, so it served him right when he failed.|It serves you right for being so rude.|“I got wet.” “It serves you right. I told you to take an umbrella.”"},
{f:3,r:"idiom",w:"get a move on",t:"/ɡɛt ə muːv ɑːn/",d:"(informal) to hurry.",uk:"ворушитися, поспішати",c:"Thomas tells her to hurry so that Ada does not get angry.",e:"Get a move on, or we’ll miss the bus.|We have to get a move on. The film starts in ten minutes.|Tell the kids to get a move on."},
{f:2,r:"idiom",w:"throw a fit",t:"/θroʊ ə fɪt/",d:"(informal) to become very angry and shout or behave in a wild way.",uk:"влаштувати істерику, розлютитися",c:"Her father was furious about the rabbi’s son. She imagines how much worse he would be if she flirted with Thomas.",e:"My boss threw a fit when he saw the mistake.|The toddler threw a fit in the supermarket.|Dad will throw a fit if you break his phone."},
{f:2,w:"periodically",t:"/ˌpɪriˈɑːdɪkli/",d:"at regular intervals, or from time to time.",uk:"через певні проміжки часу; періодично",c:"Ada lifts her cigarette to her mouth every now and then while she waits.",e:"I check my email periodically during the day.|The machine stops periodically to cool down.|He looked up periodically to check the clock."},
{f:2,w:"dispel",t:"/dɪˈspɛl/",d:"to make a feeling, idea or belief go away.",uk:"розвіяти (страхи, сумніви)",c:"The fine lines around Ada’s eyes show that she is older, so the young look from behind disappears.",e:"The teacher’s kind words dispelled my fears.|The report dispelled the rumors about the company.|A cup of tea dispelled my worry."},
{f:2,w:"good grief",t:"/ɡʊd ɡriːf/",d:"(informal) used to show that you are surprised, shocked or annoyed.",uk:"ну й ну!; о боже! (здивування, обурення чи роздратування)",c:"Ada is shocked at how much luggage her great-niece has brought.",e:"Good grief! Is it already midnight?|Good grief, how much did this cost?|Good grief, look at the mess in here!"},
{f:2,w:"cheeky",t:"/ˈtʃiːki/",d:"(informal) slightly rude or disrespectful, but in a funny way.",uk:"зухвалий, нахабнуватий (але кумедний)",c:"Thomas jokes with Ada in a way that is a little rude, but she likes it.",e:"That was a cheeky answer, young man.|The cheeky boy stole a biscuit.|She gave me a cheeky smile."},
{f:2,r:"idiom",w:"don’t I know it",t:"/doʊnt aɪ noʊ ɪt/",d:"(informal) used to say that you agree strongly because you know it from your own experience.",uk:"і не кажіть! / ще б пак!",c:"Ada says Thomas is the only one allowed to talk to her like this, and he answers that he knows it well.",e:"“This job is tiring.” “Don’t I know it!”|“Winters here are cold.” “Don’t I know it!”|“Children are expensive.” “Don’t I know it!”"},
{f:3,w:"with all due respect",t:"/wɪð ɔːl duː rɪˈspɛkt/",d:"(formal) a polite phrase used before you disagree with someone.",uk:"при всій повазі",c:"Thomas politely tells Ada that her fast driving will not help the trunk fit in the car.",e:"With all due respect, I think you are wrong.|With all due respect, sir, we need more time.|With all due respect, the plan is too expensive."},
{f:1,r:"phrasal verb",w:"peel out",t:"/piːl aʊt/",d:"(informal) to drive away very fast, making the tires squeal.",uk:"виїхати з пробуксовкою / стрімко стартувати",c:"Ada drives off very fast without even looking.",e:"The car peeled out of the parking lot.|He peeled out and left black marks on the road.|The police car peeled out after the thief."},
{f:3,uk:"згодиться, цього вистачить, підійде",w:"will do",t:"/wɪl duː/",d:"to be good enough or acceptable.",c:"Ada says Marilyn’s dress is good enough, and that Marilyn can just call her “Ada”, nothing more.",e:"Any chair will do.|A small gift will do.|Don’t buy a big cake. A small one will do."},
{v:"pull something off",f:2,r:"phrasal verb",w:"pull off",t:"/pʊl ɔːf/",d:"(informal) to succeed in doing something difficult; also, to wear something in a stylish way.",uk:"здобути успіх у чомусь складному / стильно носити щось",c:"Ada says the lipstick looks bad on Marilyn, but that she herself can wear anything well.",e:"Only she can pull off that hat.|They pulled off a big surprise party.|It’s a bright color, but he pulls it off."},
{f:2,w:"look someone up and down",t:"/lʊk ˈsʌmwʌn ʌp ænd daʊn/",d:"to look at a person from head to feet, often to judge them.",uk:"оглянути з голови до ніг",c:"Ada checks Marilyn’s clothes carefully before saying that the dress is acceptable.",e:"The guard looked me up and down before he let me in.|She looked him up and down and shook her head.|The tailor looked her up and down and took out a tape measure."},
{f:1,w:"purse your lips",t:"/pɜːrs jʊr lɪps/",d:"to press your lips tightly together, often to show disapproval, annoyance or deep thought.",uk:"стиснути губи (від невдоволення, сумніву чи задумавшись)",c:"Ada presses her lips together as she studies her reflection in the mirror.",e:"The teacher pursed her lips and said nothing.|He pursed his lips and thought about the answer.|She pursed her lips in the mirror."},
{f:3,w:"know better (than)",t:"/noʊ ˈbɛtər/",d:"to be wise enough not to do something.",uk:"бути достатньо розумним, щоб чогось не робити",c:"She finds Thomas handsome, but she knows that she should not flirt with him.",e:"You are old enough to know better.|I should have known better than to trust him.|He knows better than to argue with his boss."}
],

"Chapter 5": [
{f:2,w:"unfazed",t:"/ʌnˈfeɪzd/",d:"not worried or shocked by something unusual or difficult.",uk:"незворушний, не наляканий",c:"Thomas stays calm during Ada’s very fast driving.",e:"She was unfazed by the loud noise.|He seemed unfazed by the bad news.|The speaker was unfazed by the question."},
{f:2,w:"put someone in their place",t:"/pʊt ˈsʌmwʌn ɪn ðɛr pleɪs/",d:"to show someone that they are less important than they think, often in a firm or rude way.",uk:"поставити когось на місце",c:"She wonders if Ada made her sit in the back seat to teach her to show respect.",e:"The teacher put the rude student in his place.|She put him in his place with one sharp answer.|My sister puts me in my place when I boast."},
{f:2,w:"I stand corrected",t:"/aɪ stænd kəˈrɛktɪd/",d:"(formal) used to admit that you were wrong.",uk:"визнаю свою помилку / я помилявся",c:"Ada admits that Thomas was right when he said the rope would hold the luggage.",e:"You are right, the film is on Friday. I stand corrected.|I stand corrected. It was not his fault.|I said it was cheap, but I stand corrected."},
{f:2,w:"seethe",t:"/siːð/",d:"to be extremely angry but not show it.",uk:"кипіти від люті (приховано)",c:"She feels very angry about Ada’s rules but hides it.",e:"He sat in the car, seething.|She seethed with anger when he laughed.|I was seething inside after the meeting."},
{f:3,w:"off limits",t:"/ɔːf ˈlɪmɪts/",d:"not allowed to be touched, entered or discussed.",uk:"заборонена зона / табу",c:"Ada tells Marilyn that she must stay away from Thomas.",e:"The kitchen is off limits to guests.|My sister’s room is off limits to me.|That topic is off limits at dinner."},
{f:1,w:"wayward",t:"/ˈweɪwərd/",d:"behaving badly or not following rules; difficult to control.",uk:"неслухняний, норовливий",c:"Ada complains that her family keeps sending her young women who behave badly.",e:"The school helps wayward teenagers.|A wayward son came home after many years.|The wayward child ran into the road."},
{f:3,w:"get ahead",t:"/ɡɛt əˈhɛd/",d:"to be successful in life or work.",uk:"досягти успіху, пробитися в життя",c:"Ada says that nobody succeeds by being slow, so Marilyn must hurry.",e:"If you want to get ahead, work hard.|He took evening classes to get ahead in his job.|It is hard to get ahead without a good education."},
{f:2,w:"dawn on someone",c:"Marilyn suddenly realizes that Ada has taken in other girls sent by their families, so she is not the first “wayward girl” to arrive.",t:"/dɔːn ɑːn ˈsʌmwʌn/",d:"to become clear to someone suddenly; to realize.",uk:"доходити до свідомості, осягати",e:"It dawned on me that I had left my keys at home.|It slowly dawned on him that she was joking.|It finally dawned on us that the shop was closed."},
{f:2,w:"sly",t:"/slaɪ/",d:"clever in a secret or tricky way; showing that you know something that others do not.",uk:"хитрий, лукавий",c:"Ada smiles in a knowing way before she says that Marilyn’s mother also stayed with her.",e:"He gave me a sly smile.|The sly fox ate the chickens.|She made a sly joke."},
{f:2,w:"prim and proper",t:"/prɪm ænd ˈprɑːpər/",d:"very careful about correct behavior; often too serious about rules.",uk:"надміру чемний, правильний до нудоти",c:"Marilyn cannot believe her mother was always so well behaved.",e:"My aunt is very prim and proper at the table.|He looked prim and proper in his suit.|The prim and proper teacher never laughed."},
{f:1,w:"stodgy",t:"/ˈstɑːdʒi/",d:"(informal) boring, serious and old-fashioned.",uk:"нудний, консервативний, старомодний",c:"She thinks her father is dull and fixed in his ways.",e:"He is a stodgy man who hates change.|The stodgy old bank never uses computers.|I don’t want a stodgy party."},
{f:1,r:"phrasal verb",w:"pry something out of someone",t:"/praɪ ˈsʌmθɪŋ aʊt əv ˈsʌmwʌn/",d:"to get information from a person who does not want to tell you.",uk:"витягнути інформацію / випитати секрет",c:"She decides to find out her mother’s secret from Ada, even if it takes all summer.",e:"I tried to pry the answer out of my brother.|The reporter pried the story out of her.|You can’t pry secrets out of her."},
{f:2,w:"duly noted",t:"/ˈduːli ˈnoʊtɪd/",d:"(formal) used to say that you have heard something and will remember it. It is sometimes said in a slightly sarcastic way.",uk:"взято до відома / прийнято до уваги",c:"Marilyn answers Ada’s warning about rude behavior with this slightly sarcastic phrase.",e:"“No phones in class.” “Duly noted.”|Your complaint has been duly noted.|“Don’t be late again.” “Duly noted.”"},
{f:1,w:"austere",t:"/ɔːˈstɪr/",d:"plain and simple, without comfort or decoration.",uk:"аскетичний, суворий, без зайвих зручностей",c:"Her new room is plain and bare, and it reminds her of a prison cell.",e:"The monk lived in an austere room.|The hotel room was austere but clean.|The house looked austere from the outside."},
{f:1,w:"curtly",t:"/ˈkɜːrtli/",d:"in a short and unfriendly way.",uk:"непривітно, сухо, ущипливо",c:"Ada nods briefly and without kindness.",e:"He answered curtly and walked away.|“Sit down,” the teacher said curtly.|She nodded curtly and left."},
{f:2,w:"take pity on someone",c:"In her letter, Marilyn hopes her mother will feel sorry for her and send her radio and books to fight the boredom at Ada’s.",t:"/teɪk ˈpɪti ɑːn ˈsʌmwʌn/",d:"to feel sorry for someone and help them.",uk:"зглянутися, зжалитися над кимось",e:"A kind woman took pity on the lost boy.|Take pity on me and lend me your pen.|The driver took pity on us and gave us a lift."},
{f:1,w:"flippant",t:"/ˈflɪpənt/",d:"not serious about something important; joking in a way that shows little respect.",uk:"легковажний, зухвалий",c:"Marilyn writes a joking address on the envelope: “Ada’s house of horrors”.",e:"Don’t be flippant. This is serious.|His flippant answer made the teacher angry.|She made a flippant remark about the test."},
{f:2,w:"see through someone",c:"Ada lists her house rules, including no lies, and warns Marilyn that she cannot fool her because she understands what she is up to.",t:"/siː θruː ˈsʌmwʌn/",d:"to understand that someone is lying or pretending.",uk:"бачити наскрізь (розкусити брехню)",e:"I can see through your excuses.|The teacher saw through his story.|She saw through his smile and knew he was nervous."},
{f:1,w:"sorely (disappointed / missed / needed)",t:"/ˈsɔːrli/",d:"(formal) very much; badly.",uk:"вкрай, дуже сильно",c:"Marilyn thinks Ada will be very disappointed if she expects Marilyn to do the cooking.",e:"You will be sorely missed.|Help is sorely needed here.|I was sorely tempted to say yes."}
],

"Chapter 6": [
{f:1,w:"pepper someone with questions",t:"/ˈpɛpər ˈsʌmwʌn wɪð ˈkwɛstʃənz/",d:"to ask someone a lot of questions, one after another.",uk:"засипати питаннями",c:"Ada asks Marilyn so many questions at dinner that she can hardly eat.",e:"Reporters peppered the actor with questions.|The students peppered the teacher with questions.|My aunt peppered me with questions about my new job."},
{f:2,w:"elicit",t:"/ɪˈlɪsɪt/",d:"(formal) to get a reaction, answer or information from someone.",uk:"викликати (реакцію), домогтися (відповіді)",c:"Marilyn’s joke makes Ada smile a little.",e:"The joke elicited a laugh.|The teacher tried to elicit answers from the class.|The news elicited a strong reaction."},
{f:2,w:"meddle",t:"/ˈmɛdl/",d:"to get involved in other people’s business when they do not want you to.",uk:"втручатися (у чужі справи)",c:"Ada says she does not interfere in the story of Marilyn’s mother.",e:"Don’t meddle in my life.|He likes to meddle in his children’s plans.|Please don’t meddle in their argument."},
{f:2,w:"exuberant",t:"/ɪɡˈzuːbərənt/",d:"full of energy, excitement and happiness. The noun is “exuberance”.",uk:"буйний, сповнений енергії та радості",c:"Ada says Marilyn’s lively character comes from her mother, but Marilyn cannot imagine her mother as lively.",e:"The exuberant crowd cheered the team.|She greeted us with exuberant joy.|His exuberance made everyone laugh."},
{f:3,w:"keep a straight face",t:"/kiːp ə streɪt feɪs/",d:"to stop yourself from smiling or laughing.",uk:"зберігати серйозний вираз обличчя (не сміятися)",c:"Ada wonders how Marilyn’s mother stayed serious when Marilyn said something so shocking.",e:"It was hard to keep a straight face during his joke.|She kept a straight face and told the lie.|I couldn’t keep a straight face when the dog fell in the pool."},
{f:1,r:"idiom",w:"it’s not the Dark Ages",t:"/ɪts nɑːt ðə dɑːrk ˈeɪdʒɪz/",d:"(informal) used to say that we live in modern times and old-fashioned ideas are not acceptable now.",uk:"зараз не темне середньовіччя (сучасний світ)",c:"Marilyn says she refused to marry Daniel because a woman today does not have to marry for such a reason.",e:"You can’t forbid her to work. It’s not the Dark Ages!|Why is there no Wi-Fi here? It’s not the Dark Ages!|Girls can choose their own jobs. It’s not the Dark Ages."},
{f:1,r:"idiom",w:"(be / find yourself) in a fix",t:"/ɪn ə fɪks/",d:"(informal, old-fashioned) in a difficult situation. In the book it is also a polite, old-fashioned way to say that an unmarried girl is expecting a baby.",uk:"опинитися у скрутному становищі / влетіти в халепу",c:"Ada finishes Marilyn’s sentence with this polite phrase.",e:"I’m in a fix. I’ve lost my wallet and my keys.|He found himself in a fix after he missed the last bus.|Help me out, I’m in a real fix!"},
{f:1,w:"warily",t:"/ˈwɛrɪli/",d:"in a careful way, because you think something may be dangerous or wrong.",uk:"обережно, насторожено",c:"Marilyn asks carefully if Ada is trying to find her a husband.",e:"The dog looked at the stranger warily.|She warily opened the door.|He warily tasted the strange soup."},
{f:2,w:"sinister",t:"/ˈsɪnɪstər/",d:"seeming evil or dangerous.",uk:"зловісний, недобрий",c:"Ada laughs at the idea that Marilyn’s parents would send her somewhere to do something bad.",e:"There was something sinister about the empty house.|He gave a sinister smile.|A sinister noise came from the cellar."},
{f:2,r:"phrasal verb",w:"fix someone up (with someone)",t:"/fɪks ˈsʌmwʌn ʌp/",d:"(informal) to arrange for two people to meet because you think they might like each other. It can also mean “to provide someone with something”.",uk:"влаштувати чиєсь особисте життя / познайомити з кимось",c:"Marilyn worries that Ada will try to arrange a date for her.",e:"My friend wants to fix me up with her brother.|She fixed up her sister with a nice teacher.|I don’t want you to fix me up with anyone."},
{f:3,w:"picky",t:"/ˈpɪki/",d:"(informal) difficult to please; very careful about choosing.",uk:"перебірливий, вибагливий",c:"Ada says some girls care a lot about a man’s height.",e:"My son is picky about food.|She is picky about her clothes.|Don’t be so picky. Just choose one."},
{f:1,w:"bat your eyelashes",t:"/bæt jʊr ˈaɪˌlæʃɪz/",d:"to open and close your eyes quickly, in order to flirt or to get what you want.",uk:"кліпати віями (фліртувати)",c:"Ada tells Marilyn to flirt a little with the young men to get their information.",e:"She batted her eyelashes and asked for a discount.|He joked that she batted her eyelashes at the teacher.|Batting your eyelashes won’t help you."},
{f:2,w:"marriage material",t:"/ˈmærɪdʒ məˈtɪriəl/",d:"a person who would make a good husband or wife.",uk:"гарна партія для шлюбу; людина, з якої вийде хороший чоловік / дружина",c:"In Ada’s rating system, a ten means a man who is good to marry.",e:"Tom is kind and honest. He’s marriage material.|My sister says he’s not marriage material.|She doesn’t think her boyfriend is marriage material."},
{f:3,w:"sneak out",t:"/sniːk aʊt/",d:"to leave a place quietly so that nobody sees you.",c:"Ada says a one means a man that she would secretly leave the synagogue with.",uk:"незамітно вислизнути з дому",e:"The boys snuck out of the house at night.|She sneaked out of the meeting early.|Don’t sneak out of class."},
{f:1,w:"saunter",t:"/ˈsɔːntər/",d:"to walk in a slow, relaxed way, often to look confident.",uk:"прогулюватися неквапливо, дефілювати",c:"Marilyn walks confidently toward the tennis court to get the men’s attention.",e:"He sauntered into the room ten minutes late.|She sauntered along the beach.|The cat sauntered across the yard."},
{f:2,w:"form an attachment",t:"/fɔːrm ən əˈtætʃmənt/",d:"to begin to have a close emotional connection with someone.",uk:"прив’язатися, відчути прихильність",c:"She does not plan to stay long enough to become emotionally close to anyone.",e:"Children quickly form an attachment to their teacher.|He didn’t want to form an attachment to anyone.|Dogs form an attachment to their owners."},
{f:2,w:"treacherous",t:"/ˈtrɛtʃərəs/",d:"dangerous in a way that is not easy to see; also, not loyal.",uk:"підступний, небезпечний",c:"Freddy jokes that the path is dangerous, so she takes his arm.",e:"The icy road was treacherous.|The mountain path is treacherous after rain.|The treacherous friend told our secret."},
{f:2,w:"I tell you what",t:"/aɪ tɛl juː wʌt/",d:"(informal) used to suggest a plan or an offer.",uk:"ось що я тобі скажу / пропоную наступне",c:"Marilyn makes an offer to the men: three dates, and if Ada fails, she will go out with them herself.",e:"I tell you what, I’ll cook and you wash up.|I tell you what, let’s meet at six.|I tell you what, you pay for lunch and I pay for dinner."},
{f:2,r:"idiom",w:"be game",t:"/bi ɡeɪm/",d:"(informal) willing to try something new or fun.",uk:"бути готовим спробувати щось нове чи ризиковане",c:"Freddy agrees to give his information.",e:"Want to try rock climbing? I’m game.|We’re going to a new restaurant. Are you game?|She’s game for anything."},
{v:"cut it fine (British)",f:2,r:"idiom",w:"cut it close",t:"/kʌt ɪt kloʊs/",d:"to leave very little time or space; to almost be late.",uk:"бути на волосині від запізнення / впритул по часу",c:"Ada says Marilyn came back with only a few minutes before her favorite TV show.",e:"You cut it close. The train leaves in one minute.|We cut it close and just got to the airport on time.|He always cuts it close with deadlines."},
{f:1,r:"idiom",w:"damsel in distress",t:"/ˈdæmzəl ɪn dɪˈstrɛs/",d:"(old-fashioned or humorous) a young woman who needs to be rescued.",uk:"панянка в біді (яка потребує порятунку)",c:"Marilyn jokes that men like to rescue a woman in trouble, even from a bush.",e:"He loves to play the hero for a damsel in distress.|In old stories, a knight saves a damsel in distress.|She joked that she was a damsel in distress when her car broke down."},
{f:1,r:"idiom",w:"in no time flat",t:"/ɪn noʊ taɪm flæt/",d:"(informal) very quickly.",uk:"блискавично, за лічені хвилини",c:"Marilyn imagines her father would send her home very quickly if she wrote to him about the park.",e:"She finished the test in no time flat.|The cake was gone in no time flat.|We were packed and ready in no time flat."}
],

{f:2,w:"frivolous",t:"/ˈfrɪvələs/",d:"not serious or useful; silly.",uk:"легковажний, марний, пустий",c:"Stella’s mother says that they do not allow silly hobbies for girls.",e:"She spent money on frivolous things.|He thinks reading novels is frivolous.|Don’t make a frivolous complaint."},

{f:2,w:"blossom",t:"/ˈblɑːsəm/",d:"to develop and become more confident, successful or beautiful.",uk:"розквітнути, набути впевненості",c:"Ada thinks Stella will become more confident with a quiet, kind husband.",e:"She blossomed at her new school.|His talent blossomed after he moved to Paris.|Their friendship blossomed into love."},
{f:3,r:"phrasal verb",w:"stand up to someone",t:"/stænd ʌp tuː ˈsʌmwʌn/",d:"to be brave and defend yourself against someone strong or bossy.",uk:"дати відсіч, протистояти комусь",c:"Ada says Marilyn needs a husband who is not afraid of her.",e:"Be brave and stand up to the bully.|She finally stood up to her boss.|It takes courage to stand up to your parents."},

{f:2,r:"idiom",w:"Who are you, and what have you done with …?",t:"/huː ɑːr juː ænd wʌt hæv juː dʌn wɪð/",d:"(humorous) used when someone suddenly behaves very differently from usual.",uk:"хто ви і що зробили з моїм знайомим? (жарт)",c:"Ada is surprised that Marilyn comes to breakfast neatly dressed and on time.",e:"You cleaned your room? Who are you, and what have you done with my son?|You’re early! Who are you, and what have you done with Tom?|She said sorry first. Who are you, and what have you done with my sister?"},
{f:2,w:"social climber",t:"/ˈsoʊʃəl ˈklaɪmər/",d:"(disapproving) a person who tries to enter a higher social class by making friends with rich or important people.",uk:"кар’єрист, вискочка (що прагне в еліту)",c:"Ada says the Goldman family are rich but try too hard to join the upper class.",e:"He is a social climber and only likes rich friends.|The social climber changed his name.|She was a social climber who loved fancy parties."},
{f:2,w:"sweltering",t:"/ˈswɛltərɪŋ/",d:"very hot and uncomfortable.",uk:"спекотний, задушливий",c:"It is already very hot in the morning.",e:"It was sweltering in the train.|We sat in the sweltering heat.|The city is sweltering in August."},
{f:2,w:"walk it off",t:"/wɔːk ɪt ɔːf/",d:"(informal) to walk around after a minor injury or discomfort, hoping it will go away.",uk:"розходитися, щоб полегшити незначний біль або дискомфорт",c:"She says she will walk off the calories from the sweet coffee later, but in this heat she will really sweat it out.",e:"I bumped my knee, but I’ll walk it off.|After sitting all day, I went for a walk to loosen up.|He had a minor ache and tried to walk it off."},

{f:2,w:"tower over",t:"/ˈtaʊr ˈoʊvər/",d:"to be much taller than something or someone.",uk:"вивищуватися над кимось",c:"The tall girl is much taller than her mother.",e:"He towers over his classmates.|The skyscraper towers over the city.|She towers over her little brother."},
{f:1,w:"wring your hands",t:"/rɪŋ jʊr hændz/",d:"to twist your hands together because you are worried or upset.",uk:"ламати руки (від тривоги чи відчаю)",c:"The mother sits worriedly, twisting her hands.",e:"She wrung her hands as she waited.|The man wrung his hands and said nothing.|Stop wringing your hands. Everything is fine."},
{f:1,w:"bemoan",t:"/bɪˈmoʊn/",d:"(formal) to complain about something sadly.",uk:"оплакувати, жалітися на щось",c:"The mother keeps complaining about her daughter’s looks.",e:"He bemoaned the loss of his job.|People bemoan the high prices.|She bemoaned her bad luck."},

{f:1,w:"inane",t:"/ɪˈneɪn/",d:"very silly and without meaning.",uk:"безглуздий, порожній",c:"She thinks a good wife is expected to listen to every silly word her husband says.",e:"He made inane comments.|The show was full of inane jokes.|I’m tired of this inane talk."},
{f:1,w:"let someone have it",t:"/lɛt ˈsʌmwʌn hæv ɪt/",d:"(informal) to attack someone with angry words.",uk:"накинутися з докорами / влаштувати рознос",c:"She almost shouts at the mother, but she controls herself.",e:"I wanted to let him have it for lying.|She let me have it for being late.|The coach let the players have it."},

{f:2,w:"loom",t:"/luːm/",d:"to appear as a large, often frightening shape.",uk:"маячити, нависати",c:"The tall girl stands above the others in the room.",e:"A dark mountain loomed ahead.|The tall man loomed over me.|The exams loomed, and I was nervous."},
{f:3,r:"phrasal verb",w:"stand out",t:"/stænd aʊt/",d:"to be easy to see, or to be clearly better than others.",uk:"виділятися, кидатися в очі",c:"With her better posture, the girl’s cheekbones are easy to see.",e:"Her red hat stood out in the crowd.|He stands out among the students.|Her voice stands out."},
{f:2,r:"idiom",w:"worship the ground someone walks on",t:"/ˈwɜːrʃɪp ðə ɡraʊnd ˈsʌmwʌn wɔːks ɑːn/",d:"to love someone very much and treat them as perfect.",uk:"боготворити землю, по якій хтось ходить",c:"Ada says the mother will love any man who takes her daughter off her hands.",e:"He worships the ground she walks on.|Her fans worship the ground she walks on.|The little boy worships the ground his brother walks on."},
{f:1,r:"idiom",w:"take someone off someone’s hands",t:"/teɪk ˈsʌmwʌn ɔːf ˈsʌmwʌnz hændz/",d:"to take responsibility for someone or something so that another person is free of it.",uk:"забрати когось / щось із чиїхось рук, перебрати на себе турботу",c:"Ada jokes that a mother will be relieved when someone else takes responsibility for her daughter.",e:"Can you take the kids off my hands for an hour?|He took the old car off my hands.|They took the puppy off our hands."},
{f:2,r:"idiom",w:"true colors",t:"/truː ˈkʌlərz/",d:"someone’s real character, which is often hidden. You can say “show your true colors” or “see someone’s true colors”.",uk:"правдиве обличчя, справжня сутність",c:"Marilyn sees that Ada is kinder than she pretends to be.",e:"In a crisis, people show their true colors.|I saw his true colors when he lied.|The game showed her true colors."}

{f:3,r:"idiom",w:"call it a day",t:"/kɔːl ɪt ə deɪ/",d:"to stop working on something for the rest of the day.",uk:"завершити роботу на сьогодні",c:"After a long afternoon of hosting guests, Ada decides to rest.",e:"Let’s call it a day and go home.|After ten hours of driving, they called it a day.|It’s almost six o’clock; let’s call it a day."},

{f:3,r:"idiom",w:"keep an eye out (for)",t:"/kiːp ən aɪ aʊt/",d:"to watch carefully for someone or something to appear.",uk:"пильно стежити / виглядатися когось",c:"Marilyn watches the street for Thomas’s return in the car.",e:"Keep an eye out for the mailman.|I kept an eye out for a cheap apartment.|Keep an eye out for any signs of trouble."},
{f:3,r:"idiom",w:"play it by ear",t:"/pleɪ ɪt baɪ ɪr/",d:"to decide how to deal with a situation as it develops, without a fixed plan.",uk:"діяти за обставинами / імпровізувати",c:"She doesn’t know what the young man will say, so she decides to improvise.",e:"We don’t have a plan for tomorrow, so let’s play it by ear.|I don’t know what he will ask, I’ll just play it by ear.|Let’s play it by ear and see how we feel."},
{f:3,r:"idiom",w:"read between the lines",t:"/riːd bɪˈtwiːn ðə laɪnz/",d:"to understand a hidden meaning that is not said directly.",uk:"читати між рядків",c:"Marilyn tries to guess the real meaning behind her mother’s letter.",e:"If you read between the lines, she is asking for help.|Reading between the lines, I think he wants to quit.|You have to read between the lines to understand his message."},
{f:2,r:"idiom",w:"steal someone’s thunder",t:"/stiːl ˈsʌmwʌnz ˈθʌndər/",d:"to take attention away from someone else’s success by doing something impressive first.",uk:"перехопити чиюсь славу / затьмарити когось",c:"She didn’t want to take attention away from her friend’s good news.",e:"She stole my thunder by announcing her engagement at my birthday party.|Don’t steal his thunder; let him share his story first.|He felt his brother stole his thunder."},
{f:2,r:"idiom",w:"a bird in the hand is worth two in the bush",t:"/ə bɜːrd ɪn ðə hænd ɪz wɜːrθ tuː ɪn ðə bʊʃ/",d:"it is better to keep something you already have than risk losing it for something better.",uk:"краще синиця в жмені, ніж журавель у небі",c:"Ada advises a guest to appreciate a stable candidate rather than waiting for perfection.",e:"He decided to take the guaranteed job—a bird in the hand is worth two in the bush.|Why risk your current income? A bird in the hand is worth two in the bush.|She kept her old car, remembering that a bird in the hand is worth two in the bush."}
],

"Chapter 15": [
{f:2,r:"idiom",w:"bark up the wrong tree",t:"/bɑːrk ʌp ðə rɔːŋ triː/",d:"to make a wrong assumption or follow the wrong line of thought.",uk:"помилятися адресою / шукати не там",c:"Marilyn tells Ada that her suspicions about Thomas are completely wrong.",e:"If you think I took your keys, you’re barking up the wrong tree.|The police were barking up the wrong tree during the investigation.|She is barking up the wrong tree if she expects him to apologize."},
{f:3,r:"idiom",w:"beat around the bush",t:"/biːt əˈraʊnd ðə bʊʃ/",d:"to avoid talking about the main topic directly.",uk:"ходити навколо та навколо",c:"Ada tells the guest to speak directly instead of avoiding the point.",e:"Stop beating around the bush and tell me what happened.|He beat around the bush for ten minutes before asking for a loan.|Don’t beat around the bush; give me a clear answer."},
{f:3,r:"idiom",w:"bite off more than you can chew",t:"/baɪt ɔːf mɔːr ðæn juː kæn tʃuː/",d:"to try to do something that is too difficult for you.",uk:"узяти на себе занадто багато",c:"She realizes organizing three dates in one weekend was too much work.",e:"I bit off more than I could chew by taking three courses.|Don’t bite off more than you can chew with this new project.|He bit off more than he could chew when he agreed to build the house alone."},
{f:2,r:"idiom",w:"bless your heart",t:"/blɛs jʊr hɑːrt/",d:"used to show affection or mild pity, sometimes with slight irony.",uk:"свята простота / дай тобі боже здоров'я",c:"Ada says this to a naive young woman who believes everything she hears.",e:"Bless your heart, you really tried your best.|Oh, bless your heart for bringing me flowers!|Bless her heart, she thought the story was real."},
{f:3,r:"idiom",w:"break the ice",t:"/breɪk ðə aɪs/",d:"to make people feel more comfortable in a social situation.",uk:"розтопити лід / розрядити обстановку",c:"Marilyn tells a quick joke to start the conversation at dinner.",e:"A short game helped to break the ice among the new students.|He told a joke to break the ice.|Starting with a smile is a good way to break the ice."},
{f:2,r:"idiom",w:"burn bridges",t:"/bɜːrn ˈbrɪdʒɪz/",d:"to destroy relationships or opportunities permanently.",uk:"спалювати мости",c:"Her mother warns her not to ruin her relationship with her father forever.",e:"Don’t burn your bridges when leaving your old job.|She burned all her bridges by being rude to her former colleagues.|He realized he had burned his bridges and could not return."},
{f:3,r:"idiom",w:"cut corners",t:"/kʌt ˈkɔːrnərz/",d:"to do something in the easiest, cheapest or quickest way, often lowering quality.",uk:"робити як-небудь / економити на якості",c:"Ada warns the cook not to lower the standard of the meal preparation.",e:"They cut corners when building the house, so the roof leaked.|Don’t cut corners on your homework.|The company cut corners to save money."},
{f:2,r:"idiom",w:"drop a bombshell",t:"/drɑːp ə ˈbɑːmʃɛl/",d:"to announce shocking or unexpected news suddenly.",uk:"ошелешити новиною / підкинути бомбу",c:"A guest reveals unexpected news about her family during tea.",e:"She dropped a bombshell when she announced she was moving tomorrow.|His sudden resignation dropped a bombshell at the office.|The news dropped a bombshell on everyone."}
],

"Chapter 16": [

{f:3,r:"idiom",w:"give someone the benefit of the doubt",t:"/ɡɪv ðə ˈbɛnɪfɪt əv ðə daʊt/",d:"to choose to believe someone even if you are not completely sure.",uk:"повірити на слово / виправдати на користь сумніву",c:"Marilyn decides to trust Thomas’s explanation for now.",e:"Let’s give him the benefit of the doubt until we know the facts.|I gave her the benefit of the doubt and believed her story.|She deserved the benefit of the doubt."},
{f:2,r:"idiom",w:"go cold turkey",t:"/ɡoʊ koʊld ˈtɜːrki/",d:"(informal) to stop a bad habit suddenly and completely.",uk:"різко зав'язати / раптово покинути звичку",c:"Ada jokes about quitting cigarettes instantly.",e:"He quit smoking cold turkey two years ago.|Going cold turkey can be very hard.|She went cold turkey on sugar last month."},
{f:3,r:"idiom",w:"hit the sack",t:"/hɪt ðə sæk/",d:"(informal) to go to bed to sleep.",uk:"лягати спати",c:"Exhausted after a long day, Marilyn goes to her room early.",e:"I’m very tired, so I’m going to hit the sack.|He hit the sack right after dinner.|What time do you usually hit the sack?"},
{f:3,r:"idiom",w:"in the heat of the moment",t:"/ɪn ðə hiːt əv ðə ˈmoʊmənt/",d:"done or said without thinking because of strong emotion at that time.",uk:"у пориві пристрасті / під гарячу руку",c:"She said something angry without thinking during their argument.",e:"I said terrible things in the heat of the moment.|He apologized for shouting in the heat of the moment.|Don’t make decisions in the heat of the moment."},
{f:2,r:"idiom",w:"jump on the bandwagon",t:"/dʒʌmp ɑːn ðə ˈbændˌwæɡən/",d:"to join a popular activity or follow an opinion just because others are doing it.",uk:"приєднатися до більшості / підхопити тренд",c:"The young women all started copying Ada’s fashion advice.",e:"Many companies jumped on the bandwagon of green energy.|Don’t just jump on the bandwagon; think for yourself.|Every girl jumped on the bandwagon and bought the red lipstick."},
{f:3,r:"idiom",w:"keep your chin up",t:"/kiːp jʊr tʃɪn ʌp/",d:"used to encourage someone to stay brave and positive in a tough situation.",uk:"тримати хвіст пістолетом / не вішати носа",c:"Ada encourages Marilyn when she feels discouraged about her future.",e:"Keep your chin up! Everything will turn out fine.|She tried to keep her chin up despite the failure.|Keep your chin up and keep trying."}
],

],

"Chapter 22": [

{f:3,r:"idiom",w:"put your foot down",t:"/pʊt jʊr fʊt daʊn/",d:"to be very strict in opposing something.",uk:"проявити твердість / сказати рішуче «ні»",c:"Her father established firm rules that could not be broken.",e:"Mom put her foot down and cancelled the party.|You need to put your foot down with him.|She put her foot down regarding the curfew."},
{f:1,r:"idiom",w:"read the riot act",t:"/riːd ðə ˈraɪrt ækt/",d:"to scold someone severely and warn them to change their behavior.",uk:"суворо насварити, влаштувати прочухана",c:"Ada gives someone a severe telling-off and warns them not to break the rules again.",e:"The manager read the riot act to the employees who kept arriving late.|My dad read me the riot act after I came home late.|She read us the riot act before the trip."},
{f:2,r:"idiom",w:"right as rain",t:"/raɪt æz reɪn/",d:"completely healthy or fine again.",uk:"як новенький, цілком добре",c:"Lillian says she will feel fine after a short rest.",e:"After a nap I’ll be right as rain.|He was right as rain by morning.|Take some rest and you’ll be right as rain."},
{f:1,r:"idiom",w:"save your skin",t:"/seɪv jʊr skɪn/",d:"to protect yourself from harm or punishment, often selfishly.",uk: "врятувати власну шкіру / уникнути покарання",c:"She refused to betray her friend just to protect herself.",e:"He tried to blame others to save his skin.|She wouldn’t throw anyone under the bus to save her skin.|Always face consequences rather than just saving your skin."},

{f:2,r:"idiom",w:"steal the show",t:"/stiːl ðə ʃoʊ/",d:"to attract the most attention and praise in a group or performance.",uk:"затьмарити всіх / привернути всю увагу на себе",c:"Her confident presentation impressed everyone at the event.",e:"She wore a stunning dress and stole the show.|The youngest actor stole the show.|His speech really stole the show."},
{f:1,w:"supplant",t:"/səˈplænt/",d:"to take the place of someone or something.",uk:"витіснити, посісти чиєсь місце",c:"Marilyn thinks she has taken Lillian’s place, not the other way around.",e:"Email has supplanted letters.|The young player supplanted the captain.|New technology supplanted the old methods."},
{f:3,r:"phrasal verb",w:"win someone over",t:"/wɪn ˈsʌmwʌn ˈoʊvər/",d:"to persuade someone to like or support you.",uk:"завоювати чиюсь прихильність",c:"Lillian says she will gain Marilyn’s trust.",e:"He won the crowd over with a joke.|She won her boss over.|I’ll win them over in time."}

const $=s=>document.querySelector(s),app=$("#app"),sel=$("#ch"),tabs=$("#tabs"),only=$("#only");

const shuffle=a=>{a=[...a];for(let n=a.length-1;n>0;n--){const j=Math.random()*(n+1)|0;[a[n],a[j]]=[a[j],a[n]]}return a};
const norm=s=>s.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z\s-]/g,"").replace(/\s+/g," ").trim();

Object.entries(CHAPTERS).forEach(([n,a])=>a.forEach(k=>{
  k.id=n+"|"+k.w;

  if(k.ex) k.e=k.ex[0];
}));

let P={};try{P=JSON.parse(localStorage.getItem("vocab-progress")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("vocab-progress",JSON.stringify(P))}catch(e){}};
const cards=()=>sel.value?CHAPTERS[sel.value]:Object.values(CHAPTERS).flat();
const left=()=>cards().filter(k=>P[k.id]!=="known");
const pool=()=>only.checked?left():cards();

let mode=0,q=null,i=0,flip=false,hist=[],r={known:0,learning:0},deck=null,score=0,answered=false;

sel.innerHTML=`<option value="">All chapters</option>`+Object.keys(CHAPTERS).map(k=>`<option>${esc(k)}</option>`).join("");
tabs.innerHTML=MODES.map((m,n)=>`<button data-m="${n}">${m}</button>`).join("");
let lastP=0,lastCh=null;
const rawPct=()=>{const t=cards().length;return t?(t-left().length)/t*100:0};
const stats=()=>{const t=cards().length,l=left().length,p=rawPct(),f=lastCh===sel.value?lastP:p;
 return `<div class="prog"><div class="st"><span>Known: ${t-l} / ${t}</span><span>Still learning: ${l}</span><span>${Math.round(p)}%</span></div>
 <div class="trk" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><span class="pet" aria-hidden="true" style="left:${f}%">🦘</span><div class="bar"><i style="width:${f}%"></i></div></div></div>`};

function animBar(){const b=$(".prog .bar i");if(!b)return;const p=rawPct(),pe=$(".prog .pet");
 requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.width=p+"%";pe.style.left=p+"%";}));lastP=p;lastCh=sel.value}
