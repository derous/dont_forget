const TAGS=new Set(["informal","formal","British","old-fashioned","humorous","disapproving"]);
const info=k=>{let d=k.d,tags=[];const m=d.match(/^\(([^)]*)\)\s*/);
 if(m){const p=m[1].split(/\s*(?:,|\bor\b)\s*/).map(x=>x.trim()).filter(Boolean);
  if(p.length&&p.every(x=>TAGS.has(x))&&d.length>m[0].length){tags=p;d=d.slice(m[0].length)}}
 return{d,tags:(k.r?[k.r]:[]).concat(tags)}};
let usVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US$/i.test(x.lang));
  usVoice=v.find(x=>/Google US English|Samantha|Allison|Ava|Aria|Jenny|Zira|Joanna/i.test(x.name))||v.find(x=>x.localService)||v[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speakWord(text){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    text=text.replace(/\((verb|noun|adj\.?|adjective)\)/g," ").replace(/[()\/…]/g," ").replace(/\s+/g," ").trim();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";
    if(usVoice)u.voice=usVoice;
    window.speechSynthesis.speak(u);
  }
}

function reset(){q=null;deck=null;i=0;flip=false;hist=[];r={known:0,learning:0};score=0;answered=false;render()}

 if(!cards().length){app.innerHTML="<p>No cards here yet.</p>";return}[flash,quiz,list][mode]();animBar()}
function startOver(){cards().forEach(k=>delete P[k.id]);save();reset()}
function mark(s){const k=q[i];hist.push({id:k.id,prev:P[k.id],s});P[k.id]=s;save();r[s]++;i++;flip=false;render()}
function undo(){const h=hist.pop();if(!h)return;i--;r[h.s]--;if(h.prev===undefined)delete P[h.id];else P[h.id]=h.prev;flip=false;render()}

 const k=q[i],nf=info(k);

     <b>${esc(k.w)}</b>
     ${k.t ? `<div class="phonetic">${esc(k.t)}</div>` : ''}
     ${nf.tags.length?`<div class="chips fchips">${nf.tags.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:''}
     <button class="btn-listen" id="btn-audio">🔊 Listen to it</button>
     <div class="hint">Tap card to flip</div>
   </div>
   <div class="face back">
     <div class="stars" role="img" aria-label="Frequency: ${FL[k.f||2]}">${stars(k.f||2)}<div class="fcap">Frequency: ${FL[k.f||2]}</div></div>
     <h3>Meaning</h3>
     <p>${esc(nf.d)}</p>
     ${(k.q||k.c)?`<h3>${k.q?"In the book":"Book context"}</h3>`:''}
     ${k.q?`<blockquote>${esc(k.q)}</blockquote>`:""}
     ${k.c?`<p>${esc(k.c)}</p>`:""}
     ${k.v?`<p class="var">Later in the book it may also appear as: <b>${esc(k.v)}</b></p>`:''}
     ${k.ex ? `<h3>Examples</h3><ul>${k.ex.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ''}
     <div style="margin-top:14px; text-align:center;">
       <button class="btn-uk" id="btn-uk">🇺🇦 See in Ukrainian</button>
       <div id="uk-details" class="uk-box" style="display:none;">
         ${k.uk ? esc(k.uk) : 'Переклад або пояснення готується...'}
       </div>
     </div>
   </div>
 </div>
 </div>
 <div class="acts"><button class="no" id="sl">Still learning</button><button class="ok" id="kn">I know it</button></div>
 <p class="ctl"><button id="un">Undo</button><span class="sc">${i+1} / ${q.length}</span></p>`;

 const c=$(".card");
 c.onclick=(e)=>{
   if(e.target.closest('#btn-audio') || e.target.closest('#btn-uk')) return;
   flip=!flip;
   c.classList.toggle("f");
 };
 
 $("#btn-audio").onclick=(e)=>{
   e.stopPropagation();
   speakWord(k.w);
 };


 $("#btn-uk").onclick=(e)=>{
   e.stopPropagation();
   const ukDiv = $("#uk-details");
   ukDiv.style.display = (ukDiv.style.display === "none") ? "block" : "none";
 };

 $("#sl").onclick=()=>mark("learning");
 $("#kn").onclick=()=>mark("known");
 $("#un").onclick=undo;
}

function qstart(){if(deck===null){deck=shuffle(pool());i=0;score=0;answered=false}
 if(!deck.length){app.innerHTML=`<div class="box"><h2>No words to practice</h2><p>Turn off the “still learning” filter or reset progress.</p></div>`;return false}
 if(i>=deck.length){app.innerHTML=`<div class="box"><h2>Done! Score: ${score} / ${deck.length}</h2><button class="pri" id="ag">Try again</button></div>`;$("#ag").onclick=reset;return false}
 return true}

let qscope="chapter";
function distractors(k){
  const all=Object.values(CHAPTERS).flat(),nk=norm(k.w),ok=x=>x!==k&&norm(x.w)!==nk;
  const local=(sel.value&&qscope==="chapter")?CHAPTERS[sel.value].filter(ok):[];
  const picked=shuffle(local).slice(0,3);
  if(picked.length<3){const used=new Set([k,...picked]);
   picked.push(...shuffle(all.filter(x=>ok(x)&&!used.has(x))).slice(0,3-picked.length))}
  return picked;
}
function quiz(){
 if(!qstart())return;
 const k=deck[i],opts=shuffle([k,...distractors(k)]);
 const seg=sel.value?`<div class="seg" role="group" aria-label="Answer options"><span class="sc">Answer options from:</span><button data-s="chapter" aria-pressed="${qscope==="chapter"}">This chapter</button><button data-s="book" aria-pressed="${qscope==="book"}">Whole book (harder)</button></div>`:"";
 app.innerHTML=seg+`<div class="st"><span>Question ${i+1} / ${deck.length}</span><span>Score ${score}</span></div><div class="q"><div class="def">Which word or expression means: ${esc(k.d)}</div>
 ${opts.map(o=>`<button class="opt">${esc(o.w)}</button>`).join("")}<div id="fb"></div></div>`;
 app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{qscope=b.dataset.s;deck=null;i=0;score=0;answered=false;render()});
 app.querySelectorAll(".opt").forEach((b,n)=>b.onclick=()=>{
  if(answered)return;answered=true;const right=opts[n]===k;if(right)score++;
  app.querySelectorAll(".opt").forEach((x,m)=>{if(opts[m]===k)x.classList.add("good")});if(!right)b.classList.add("bad");
  $("#fb").innerHTML=`<p class="msg ${right?"good":"bad"}">${right?"Correct!":"Not quite."}</p><p><em>${esc(k.e||'')}</em></p><button class="pri" id="nq">Next question</button>`;
  $("#nq").onclick=()=>{answered=false;i++;render()}});
}

function type(){
 if(!qstart())return;
 const k=deck[i];
 app.innerHTML=`<div class="st"><span>Question ${i+1} / ${deck.length}</span><span>Score ${score}</span></div><div class="q"><div class="def">Type the word or expression: ${esc(k.d)}</div>
 ${k.c?`<p class="sc">Hint: ${esc(k.c)}</p>`:''}<input type="text" id="in" autocomplete="off" autocapitalize="off" aria-label="Your answer"><button class="pri" id="ck">Check</button> <button id="rv">Show answer</button><div id="fb"></div></div>`;
 const inp=$("#in");inp.focus();
 const nx=`<p><button class="pri" id="nq">Next question</button></p>`,bind=()=>{$("#nq").onclick=()=>{i++;render()}};
 const check=()=>{const a=norm(inp.value),t=norm(k.w),alt=t.replace(/^(to|be|get|make)\s+/,"");if(!a){$("#fb").innerHTML=`<p class="msg bad">Enter an answer first.</p>`;return}
  if(a==t||a==alt){score++;$("#fb").innerHTML=`<p class="msg good">Correct: ${esc(k.w)}</p><p><em>${esc(k.e||'')}</em></p>${nx}`;bind()}
  else $("#fb").innerHTML=`<p class="msg bad">Not yet. Try again or show the answer.</p>`};
 $("#ck").onclick=check;inp.onkeydown=e=>{if(e.key=="Enter")check()};
 $("#rv").onclick=()=>{$("#fb").innerHTML=`<p class="msg bad">Answer: ${esc(k.w)}</p><p><em>${esc(k.e||'')}</em></p>${nx}`;bind()};
}

function list(){
 app.innerHTML=stats()+`<input type="search" id="sr" placeholder="Search words" aria-label="Search words"><div id="ls"></div>`;
 let shown=[];
 const draw=()=>{const f=$("#sr").value.toLowerCase();shown=pool().filter(k=>k.w.toLowerCase().includes(f));
  $("#ls").innerHTML=!shown.length?`<p class="sc">${only.checked&&!f?"No words left to learn here. Turn off the filter to see all words.":"No words found."}</p>`:shown.map((k,n)=>{const kn=P[k.id]==="known";return `<details class="it"><summary><span>${esc(k.w)} ${k.t?`<small class="phonetic">${esc(k.t)}</small>`:''}</span><em class="${kn?"kn":""}">${kn?"known":"still learning"}</em></summary>
  <p>${esc(k.d)}</p>${k.uk?`<p style="color:var(--ac)">🇺🇦 ${esc(k.uk)}</p>`:''}${k.q?`<p><em>“${esc(k.q)}”</em></p>`:""}${k.c?`<p>${esc(k.c)}</p>`:''}${k.v?`<p class="var">Also: <b>${esc(k.v)}</b></p>`:''}${k.ex?`<ul>${k.ex.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:''}<button class="tg" data-n="${n}">${kn?"Mark as still learning":"Mark as known"}</button></details>`}).join("")};
 draw();$("#sr").oninput=draw;
 $("#ls").onclick=e=>{const b=e.target.closest(".tg");if(!b)return;const k=shown[+b.dataset.n];
  if(P[k.id]==="known")delete P[k.id];else P[k.id]="known";save();const kn=P[k.id]==="known";
  b.textContent=kn?"Mark as still learning":"Mark as known";const em=b.closest("details").querySelector("em");em.textContent=kn?"known":"still learning";em.className=kn?"kn":""
  $(".prog").outerHTML=stats();animBar()};
}

sel.onchange=reset;only.onchange=()=>{deck=null;render()};
tabs.onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=+b.dataset.m;deck=null;i=0;score=0;answered=false;render()};
$("#reset").onclick=startOver;
document.onkeydown=e=>{if(mode!=0||!q||i>=q.length||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key=="ArrowLeft")mark("learning");else if(e.key=="ArrowRight")mark("known");else if(e.key==" "){e.preventDefault();$(".card").click()}};
reset();
</script>
</body></html>
